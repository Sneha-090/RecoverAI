name: Tests and ML evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests without live credentials
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Reproduce held-out synthetic ML evaluation
        run: >-
          python -m ML.train_model
          --model "${{ runner.temp }}/recovery_model.joblib"
          --report "${{ runner.temp }}/evaluation.json"
      - name: Save test and evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results.xml
            ${{ runner.temp }}/evaluation.json
