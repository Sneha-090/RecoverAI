name: Tests and ML evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install project dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check resolved dependency compatibility
        run: python -m pip check
      - name: Run regression tests without live credentials
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Verify fresh versioned database upgrade
        env:
          RAZORPAY_KEY_ID: rzp_test_migration_ci
          RAZORPAY_KEY_SECRET: migration_ci_fixture
          RAZORPAY_WEBHOOK_SECRET: migration_ci_fixture
          DATABASE_URL: sqlite:///${{ runner.temp }}/migration-smoke.sqlite
        run: |
          python -m app.db.init_db
          python -m app.db.init_db --status
      - name: Reproduce held-out synthetic ML evaluation
        run: >-
          python -m ML.train_model
          --model "${{ runner.temp }}/recovery_model.joblib"
          --report "${{ runner.temp }}/evaluation.json"
      - name: Reproduce matched synthetic policy benchmark
        run: >-
          python -m ML.benchmark_policies
          --output-dir "${{ runner.temp }}/policy-benchmark"
      - name: Reproduce isolated offline recovery walkthrough
        run: >-
          python -m scripts.offline_demo
          --output-dir "${{ runner.temp }}/offline-demo"
          --work-dir "${{ runner.temp }}/offline-demo-db"
      - name: Save test and evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results.xml
            ${{ runner.temp }}/evaluation.json
            ${{ runner.temp }}/policy-benchmark/
            ${{ runner.temp }}/offline-demo/
