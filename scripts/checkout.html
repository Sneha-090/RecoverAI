<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecoverAI test checkout</title>
</head>
<body>
  <h2>RecoverAI test checkout</h2>
  <p>Operator access required. Payment outcomes are processed through signed Razorpay webhooks.</p>
  <label for="orderIdInput">Existing order ID</label><br>
  <input id="orderIdInput" type="text" placeholder="order_…" maxlength="70">
  <button id="loadBtn">Load order</button>
  <hr>
  <label for="amountInput">New order amount (rupees)</label><br>
  <input id="amountInput" type="number" min="0.01" max="10000000" step="0.01" placeholder="499.00">
  <button id="createBtn">Create test order</button>
  <p id="info" role="status" aria-live="polite"></p>
  <button id="pay" disabled>Start new payment attempt (test mode)</button>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    let currentOrder = null;
    let busy = false;
    const info = document.getElementById("info");
    const orderInput = document.getElementById("orderIdInput");
    const amountInput = document.getElementById("amountInput");
    const pay = document.getElementById("pay");

    function clearOrder() {
      currentOrder = null;
      pay.disabled = true;
    }

    function setBusy(value) {
      busy = value;
      document.getElementById("loadBtn").disabled = value;
      document.getElementById("createBtn").disabled = value;
      orderInput.disabled = value;
      amountInput.disabled = value;
    }

    async function api(path, options = {}) {
      // Same-origin browser authentication; no credentials embedded in source,
      // URLs, or localStorage. Open this page through the protected /checkout route.
      const response = await fetch(path, {credentials: "same-origin", ...options});
      if (!response.ok) {
        if (response.status === 401) throw new Error("Operator login required. Reload this page to sign in.");
        if (response.status === 422) throw new Error("Check the order ID and amount (maximum two decimal places).");
        throw new Error("Request failed (" + response.status + "). Check the backend configuration.");
      }
      return response.json();
    }

    async function loadOrder(orderId) {
      clearOrder();
      if (!/^order_[A-Za-z0-9]{1,64}$/.test(orderId)) throw new Error("Enter a valid Razorpay order ID.");
      const order = await api("/checkout-config?order_id=" + encodeURIComponent(orderId));
      if (!order.key_id.startsWith("rzp_test_")) throw new Error("This checkout supports Razorpay test mode only.");
      currentOrder = order;
      orderInput.value = order.order_id;
      info.textContent = "Loaded " + order.order_id + " · " + order.currency + " " + (order.amount_paise / 100).toFixed(2);
      info.textContent += ". " + order.checkout_note;
      pay.disabled = false;
    }

    async function run(action) {
      if (busy) return;
      setBusy(true);
      try { await action(); }
      catch (error) { clearOrder(); info.textContent = error.message; }
      finally { setBusy(false); }
    }

    orderInput.addEventListener("input", clearOrder);
    document.getElementById("loadBtn").onclick = () => run(() => loadOrder(orderInput.value.trim()));
    document.getElementById("createBtn").onclick = () => run(async () => {
      clearOrder();
      const amount = amountInput.value;
      if (!/^\d+(\.\d{1,2})?$/.test(amount) || Number(amount) <= 0 || Number(amount) > 10000000) {
        throw new Error("Enter an amount from Rs.0.01 to Rs.10,000,000, with at most two decimal places.");
      }
      const order = await api("/create-order", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({amount}),
      });
      await loadOrder(order.order_id);
    });

    pay.onclick = () => {
      if (!currentOrder || busy) return;
      const order = currentOrder;
      pay.disabled = true;
      const checkout = new Razorpay({
        key: order.key_id, order_id: order.order_id, amount: order.amount_paise, currency: order.currency,
        handler: (response) => {
          clearOrder();
          info.textContent = "Payment completed: " + response.razorpay_payment_id + ". Check the dashboard after webhook verification.";
        },
        modal: {ondismiss: () => { pay.disabled = !currentOrder; }},
      });
      checkout.on("payment.failed", (response) => {
        const id = response.error?.metadata?.payment_id || "unavailable";
        info.textContent = "Payment failed: " + id + ". RecoverAI will process the signed webhook.";
      });
      checkout.open();
    };

    const orderFromUrl = new URLSearchParams(window.location.search).get("order_id");
    if (orderFromUrl) run(() => loadOrder(orderFromUrl));
  </script>
</body>
</html>
